<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070a12">
<title>ElectroBase — цифровая база знаний</title>

<style>
/* =========================================================
   ELECTROBASE 2.0
   Всё в одном файле
========================================================= */

:root{
    --bg:#060811;
    --bg2:#0b0f1a;
    --panel:rgba(15,20,32,.78);
    --panel2:#111827;
    --line:rgba(255,255,255,.075);
    --line2:rgba(102,145,255,.35);

    --text:#f4f7ff;
    --muted:#8792a7;

    --accent:#648cff;
    --accent2:#8d65ff;
    --cyan:#59dcff;

    --green:#56e2a2;
    --yellow:#ffd45c;
    --red:#ff667c;

    --shadow:0 25px 80px rgba(0,0,0,.35);
    --radius:20px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;

    color:var(--text);

    background:
        radial-gradient(
            circle at 12% 0%,
            rgba(100,140,255,.13),
            transparent 29%
        ),
        radial-gradient(
            circle at 90% 12%,
            rgba(141,101,255,.1),
            transparent 28%
        ),
        var(--bg);

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

a{
    color:inherit;
    text-decoration:none;
}

.hidden{
    display:none!important;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    pointer-events:none;
    overflow:hidden;
}

.grid-background{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.022) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.022) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    opacity:.45;
}

.grid-background::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(89,220,255,.08),
            transparent
        ) 0 0/420px 100%;

    animation:
        backgroundSignal
        11s
        linear
        infinite;
}

@keyframes backgroundSignal{
    from{
        background-position:-420px 0;
    }

    to{
        background-position:420px 0;
    }
}

.glow{
    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    filter:blur(110px);

    opacity:.1;
}

.glow-a{
    left:-170px;
    top:100px;
    background:#547fff;
}

.glow-b{
    right:-180px;
    top:450px;
    background:#9467ff;
}

.glow-c{
    left:45%;
    bottom:-220px;
    background:#40d9ff;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:200;

    height:76px;

    display:flex;
    align-items:center;
    gap:25px;

    padding:0 5%;

    background:
        rgba(6,8,17,.73);

    border-bottom:
        1px solid var(--line);

    backdrop-filter:
        blur(22px);

    transition:.3s;
}

.header.scrolled{
    box-shadow:
        0 15px 50px rgba(0,0,0,.25);
}

/* LOGO */

.logo{
    border:0;
    background:none;
    color:white;

    display:flex;
    align-items:center;

    gap:11px;

    padding:0;
}

.logo-mark{
    position:relative;

    width:41px;
    height:41px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #608dff,
            #835dff
        );

    box-shadow:
        0 10px 35px
        rgba(94,135,255,.25);

    overflow:hidden;
}

.logo-mark svg{
    width:27px;
    height:27px;

    position:relative;
    z-index:2;
}

.logo-mark::after{
    content:"";

    position:absolute;

    width:140%;
    height:35%;

    left:-150%;
    top:30%;

    background:
        rgba(255,255,255,.25);

    transform:
        rotate(-18deg);

    animation:
        logoFlash
        4s
        ease-in-out
        infinite;
}

@keyframes logoFlash{
    0%,65%{
        left:-150%;
    }

    80%,100%{
        left:150%;
    }
}

.logo-title{
    font-size:19px;
    font-weight:800;
    letter-spacing:-.6px;
}

.logo-title span{
    color:#7b9cff;
}

.logo-subtitle{
    display:block;

    color:#667287;

    font-size:8px;

    letter-spacing:2px;

    margin-top:1px;
}

/* NAV */

.nav{
    margin-left:auto;

    display:flex;

    gap:3px;
}

.nav button{
    border:0;

    background:none;

    color:var(--muted);

    padding:
        9px
        12px;

    border-radius:10px;

    transition:.2s;
}

.nav button:hover,
.nav button.active{
    color:white;

    background:
        rgba(255,255,255,.055);
}

.header-actions{
    display:flex;
    gap:6px;
}

.icon-button{
    width:38px;
    height:38px;

    border:1px solid var(--line);

    border-radius:11px;

    background:
        rgba(255,255,255,.035);

    color:white;

    transition:.2s;
}

.icon-button:hover{
    border-color:var(--line2);

    transform:
        translateY(-1px);
}

.account-button{
    width:auto;
    min-width:85px;

    padding:
        0
        12px;
}

.mobile-button{
    display:none;
}

/* =========================================================
   MOBILE MENU
========================================================= */

.mobile-menu{
    display:none;

    position:fixed;

    top:70px;
    left:10px;
    right:10px;

    z-index:190;

    padding:10px;

    border:
        1px solid
        var(--line);

    border-radius:16px;

    background:#0c111c;

    box-shadow:var(--shadow);
}

.mobile-menu.open{
    display:grid;
}

.mobile-menu button{
    border:0;

    background:none;

    color:var(--muted);

    padding:13px;

    text-align:left;

    border-radius:10px;
}

.mobile-menu button:hover{
    color:white;

    background:
        rgba(255,255,255,.05);
}

/* =========================================================
   MAIN
========================================================= */

#app{
    width:
        min(
            1280px,
            calc(100% - 30px)
        );

    margin:auto;

    padding-top:76px;
}

.view{
    min-height:
        calc(
            100vh - 76px
        );

    animation:
        pageIn
        .4s
        ease
        both;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:
            translateY(15px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:710px;

    display:grid;

    grid-template-columns:
        1.1fr
        .9fr;

    align-items:center;

    gap:40px;

    padding:
        75px
        4%;
}

.hero-content{
    max-width:730px;
}

.status{
    display:inline-flex;

    align-items:center;

    gap:9px;

    color:#aec0ff;

    font-size:12px;

    padding:
        8px
        13px;

    border:
        1px solid
        rgba(100,140,255,.24);

    border-radius:100px;

    background:
        rgba(100,140,255,.07);

    margin-bottom:25px;
}

.status-point{
    width:7px;
    height:7px;

    border-radius:50%;

    background:
        var(--green);

    box-shadow:
        0 0 14px
        var(--green);

    animation:
        statusPulse
        2s
        infinite;
}

@keyframes statusPulse{
    50%{
        transform:
            scale(.55);

        opacity:.45;
    }
}

.hero h1{
    margin:0;

    font-size:
        clamp(
            47px,
            6.5vw,
            84px
        );

    line-height:.97;

    letter-spacing:-5px;
}

.gradient{
    background:
        linear-gradient(
            110deg,
            #fff,
            #7298ff 48%,
            #9a6cff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.hero-description{
    max-width:650px;

    color:var(--muted);

    font-size:17px;

    line-height:1.8;

    margin:
        25px
        0
        0;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;

    gap:10px;

    margin-top:30px;
}

.button{
    border:
        1px solid
        var(--line);

    background:
        rgba(255,255,255,.045);

    color:white;

    border-radius:12px;

    padding:
        12px
        16px;

    transition:.25s;
}

.button:hover{
    transform:
        translateY(-2px);

    border-color:
        var(--line2);

    background:
        rgba(255,255,255,.075);
}

.button.primary{
    border:0;

    background:
        linear-gradient(
            135deg,
            #628cff,
            #7f5dff
        );

    box-shadow:
        0 13px 42px
        rgba(98,140,255,.2);
}

.button.primary:hover{
    box-shadow:
        0 18px 55px
        rgba(98,140,255,.3);
}

/* =========================================================
   MASCOT
========================================================= */

.mascot-area{
    position:relative;

    height:480px;

    display:grid;

    place-items:center;
}

.mascot-glow{
    position:absolute;

    width:390px;
    height:390px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(85,145,255,.25),
            transparent 66%
        );

    filter:
        blur(12px);

    animation:
        mascotGlow
        4s
        ease-in-out
        infinite;
}

@keyframes mascotGlow{
    50%{
        transform:
            scale(1.12);

        opacity:.62;
    }
}

.mascot{
    width:270px;
    height:350px;

    position:relative;

    animation:
        mascotFloat
        4s
        ease-in-out
        infinite;
}

@keyframes mascotFloat{
    50%{
        transform:
            translateY(-13px);
    }
}

.mascot-head{
    position:absolute;

    left:49px;
    top:12px;

    width:172px;
    height:145px;

    border:
        2px solid
        rgba(255,255,255,.1);

    border-radius:
        46%
        46%
        40%
        40%;

    background:
        linear-gradient(
            145deg,
            #263143,
            #101722
        );

    box-shadow:
        inset
        0 -20px
        35px
        rgba(0,0,0,.3),

        0 30px
        60px
        rgba(0,0,0,.28);
}

.mascot-screen{
    position:absolute;

    left:27px;
    top:46px;

    width:115px;
    height:57px;

    border-radius:22px;

    background:#06090f;

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        inset
        0 0 25px
        rgba(66,110,220,.1);
}

.eye{
    position:absolute;

    top:68px;

    width:12px;
    height:12px;

    z-index:2;

    border-radius:50%;

    background:#75a1ff;

    box-shadow:
        0 0 16px
        #6090ff;

    animation:
        blink
        5s
        infinite;
}

.eye.left{
    left:58px;
}

.eye.right{
    left:101px;
}

@keyframes blink{
    0%,46%,50%,100%{
        transform:
            scaleY(1);
    }

    48%{
        transform:
            scaleY(.08);
    }
}

.mascot-body{
    position:absolute;

    top:145px;
    left:27px;

    width:216px;
    height:165px;

    border-radius:
        62px
        62px
        34px
        34px;

    border:
        2px solid
        rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            #1d2938,
            #0d131c
        );

    box-shadow:
        0 30px
        60px
        rgba(0,0,0,.3);
}

.mascot-core{
    position:absolute;

    left:78px;
    top:38px;

    width:59px;
    height:59px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #e2eaff 0 8%,
            #6992ff 27%,
            #334d9f 58%,
            transparent 73%
        );

    box-shadow:
        0 0 42px
        rgba(90,143,255,.68);

    animation:
        corePulse
        2s
        infinite;
}

@keyframes corePulse{
    50%{
        transform:
            scale(1.08);
    }
}

.mascot-arm{
    position:absolute;

    top:167px;

    width:47px;
    height:124px;

    border-radius:30px;

    background:
        linear-gradient(
            #202b3a,
            #10161f
        );

    border:
        2px solid
        rgba(255,255,255,.08);
}

.mascot-arm.left{
    left:-5px;
    transform:
        rotate(12deg);
}

.mascot-arm.right{
    right:-5px;
    transform:
        rotate(-12deg);
}

.mascot-name{
    position:absolute;

    width:100%;

    bottom:-12px;

    text-align:center;

    color:#708fff;

    font-size:11px;

    font-weight:800;

    letter-spacing:4px;
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
    padding:
        75px
        4%;
}

.section-head{
    display:flex;

    justify-content:
        space-between;

    align-items:flex-end;

    gap:20px;

    margin-bottom:28px;
}

.section-tag{
    margin-bottom:7px;

    font-size:10px;

    letter-spacing:2.5px;

    font-weight:800;

    color:#7695ff;
}

.section h2{
    margin:0 0 7px;

    font-size:34px;

    letter-spacing:-1.5px;
}

.section-head p{
    margin:0;

    color:var(--muted);

    font-size:13px;
}

/* =========================================================
   SUBJECTS
========================================================= */

.subject-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;
}

.subject{
    min-height:195px;

    position:relative;

    overflow:hidden;

    padding:23px;

    border:
        1px solid
        var(--line);

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(20,27,41,.9),
            rgba(11,15,24,.82)
        );

    cursor:pointer;

    transition:
        .35s
        cubic-bezier(.2,.8,.2,1);
}

.subject::before{
    content:"";

    position:absolute;

    width:210px;
    height:210px;

    border-radius:50%;

    right:-120px;
    top:-120px;

    background:
        var(--accent);

    opacity:.07;

    transition:.5s;
}

.subject:hover{
    transform:
        translateY(-7px);

    border-color:
        rgba(103,145,255,.36);

    box-shadow:
        0 26px
        55px
        rgba(0,0,0,.27);
}

.subject:hover::before{
    transform:
        scale(1.45);
}

.subject-icon{
    width:48px;
    height:48px;

    display:grid;

    place-items:center;

    border-radius:14px;

    background:
        rgba(99,141,255,.09);

    font-size:23px;

    margin-bottom:27px;
}

.subject h3{
    margin:
        0
        0
        7px;
}

.subject p{
    margin:0;

    color:var(--muted);

    line-height:1.65;

    font-size:12px;
}

/* =========================================================
   FEATURES
========================================================= */

.feature-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.feature{
    min-height:155px;

    padding:22px;

    border:
        1px solid
        var(--line);

    border-radius:18px;

    background:
        rgba(255,255,255,.025);

    transition:.3s;
}

.feature:hover{
    transform:
        translateY(-4px);

    border-color:
        var(--line2);
}

.feature-icon{
    font-size:23px;

    margin-bottom:18px;
}

.feature h3{
    margin:
        0
        0
        7px;
}

.feature p{
    margin:0;

    color:var(--muted);

    font-size:12px;

    line-height:1.65;
}

/* =========================================================
   PAGE
========================================================= */

.page{
    min-height:
        calc(
            100vh - 76px
        );

    padding:
        110px
        4%
        80px;

    animation:
        pageIn
        .4s
        ease
        both;
}

.page-header{
    max-width:900px;

    margin-bottom:30px;
}

.page-header h1{
    margin:
        6px
        0
        12px;

    font-size:
        clamp(
            38px,
            5vw,
            61px
        );

    letter-spacing:-3px;

    line-height:1;
}

.page-header p{
    margin:0;

    color:var(--muted);

    line-height:1.8;
}

/* =========================================================
   SEARCH
========================================================= */

.search-large{
    display:flex;

    align-items:center;

    gap:9px;

    max-width:900px;

    padding:5px;

    border:
        1px solid
        var(--line);

    border-radius:15px;

    background:
        rgba(255,255,255,.035);

    margin:
        25px
        0;
}

.search-large span{
    color:#7194ff;

    font-size:21px;

    padding-left:12px;
}

.search-large input{
    width:100%;

    min-width:0;

    border:0;

    outline:0;

    color:white;

    background:none;

    padding:13px 7px;
}

.search-results{
    display:grid;

    gap:8px;
}

.search-result{
    padding:16px;

    border:
        1px solid
        var(--line);

    border-radius:13px;

    background:
        rgba(255,255,255,.025);

    cursor:pointer;

    transition:.22s;
}

.search-result:hover{
    border-color:
        var(--line2);

    background:
        rgba(255,255,255,.055);
}

.search-result small{
    color:#7b9bff;
}

.search-result p{
    margin:
        4px
        0
        0;

    color:var(--muted);

    font-size:12px;
}

/* =========================================================
   FORMULAS
========================================================= */

.filters{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-bottom:23px;
}

.filter{
    border:
        1px solid
        var(--line);

    border-radius:100px;

    background:
        rgba(255,255,255,.03);

    color:var(--muted);

    padding:
        8px
        12px;

    font-size:11px;
}

.filter.active{
    color:white;

    background:
        rgba(99,140,255,.1);

    border-color:
        rgba(100,140,255,.38);
}

.formula-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:13px;
}

.formula-card{
    padding:21px;

    border:
        1px solid
        var(--line);

    border-radius:18px;

    background:
        rgba(255,255,255,.025);

    transition:.25s;
}

.formula-card:hover{
    transform:
        translateY(-4px);

    border-color:
        var(--line2);
}

.formula-category{
    color:#7891d0;

    font-size:9px;

    text-transform:
        uppercase;

    letter-spacing:1.8px;
}

.formula-card h3{
    margin:
        8px
        0;
}

.formula-expression{
    padding:13px;

    overflow:auto;

    border-radius:10px;

    background:#080b12;

    border:
        1px solid
        rgba(255,255,255,.05);

    color:#9db5ff;

    font-family:
        "Courier New",
        monospace;

    font-size:14px;

    margin:
        13px
        0;
}

.formula-card p{
    color:var(--muted);

    font-size:11px;

    line-height:1.6;

    margin:0;
}

.copy-btn{
    margin-top:13px;

    border:
        1px solid
        var(--line);

    background:
        rgba(255,255,255,.03);

    color:#b7c0d1;

    padding:
        7px
        9px;

    border-radius:8px;

    font-size:10px;
}

.copy-btn:hover{
    color:white;

    border-color:
        var(--line2);
}

/* =========================================================
   INFO / MATERIALS
========================================================= */

.material-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.info-card{
    padding:22px;

    border:
        1px solid
        var(--line);

    border-radius:18px;

    background:
        rgba(255,255,255,.025);
}

.info-icon{
    width:44px;
    height:44px;

    display:grid;

    place-items:center;

    border-radius:13px;

    background:
        rgba(98,140,255,.08);

    margin-bottom:16px;
}

.info-card h3{
    margin:
        0
        0
        8px;
}

.info-card p{
    margin:0;

    color:var(--muted);

    line-height:1.7;

    font-size:12px;
}

/* =========================================================
   CALCULATORS
========================================================= */

.calculator-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;
}

.calculator{
    padding:24px;

    border:
        1px solid
        var(--line);

    border-radius:19px;

    background:
        rgba(255,255,255,.025);
}

.calculator h3{
    margin:
        5px
        0

/* =========================================================
   API
========================================================= */

async function api(
    action,
    data={}
){

    const response =
        await fetch(
            `/api/index?action=${encodeURIComponent(action)}`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(data)
            }
        );


    let result;

    try{

        result =
            await response.json();

    }catch{

        throw new Error(
            "Сервер вернул некорректный ответ."
        );

    }


    if(
        !response.ok ||
        result.error
    ){

        throw new Error(
            result.error ||
            "Ошибка сервера."
        );

    }


    return result;

}


/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

    try{

        const publicResult =
            await api(
                "public"
            );


        state.config = {
            ...state.config,
            ...publicResult.config
        };


        updateSystemOverlay();

    }catch(error){

        console.warn(
            "Public API:",
            error.message
        );

    }


    if(state.userToken){

        try{

            const profile =
                await api(
                    "profile",
                    {
                        token:
                            state.userToken
                    }
                );


            state.user =
                profile.user;

        }catch{

            state.user=null;

            state.userToken="";

            localStorage.removeItem(
                "eb_user_token"
            );

        }

    }


    await sendHeartbeat();


    render();


    /*
    Обновляем статистику онлайн
    каждые 45 секунд.
    */

    setInterval(
        sendHeartbeat,
        45000
    );


    /*
    Проверяем технические работы
    каждые 30 секунд.
    */

    setInterval(
        checkSystem,
        30000
    );

}


/* =========================================================
   HEARTBEAT
========================================================= */

async function sendHeartbeat(){

    try{

        await api(
            "track",
            {
                sessionId:
                    state.sessionId,

                page:
                    "#" + state.page,

                userToken:
                    state.userToken ||
                    null
            }
        );

    }catch(error){

        console.warn(
            "Heartbeat:",
            error.message
        );

    }

}


/* =========================================================
   SYSTEM CHECK
========================================================= */

async function checkSystem(){

    try{

        const result =
            await api(
                "public"
            );


        state.config = {
            ...state.config,
            ...result.config
        };


        updateSystemOverlay();

    }catch(error){

        console.warn(
            "System:",
            error.message
        );

    }

}


/* =========================================================
   SYSTEM OVERLAY
========================================================= */

function updateSystemOverlay(){

    const overlay =
        document.getElementById(
            "systemOverlay"
        );


    /*
    Администратор должен иметь доступ
    даже во время технических работ.
    */

    if(
        state.config.mode !== "online" &&
        !state.adminToken
    ){

        overlay.classList.remove(
            "hidden"
        );


        const title =
            document.getElementById(
                "systemTitle"
            );

        const message =
            document.getElementById(
                "systemMessage"
            );

        const code =
            document.getElementById(
                "systemCode"
            );


        title.textContent =
            state.config.mode === "error"
            ?
            "Система временно недоступна"
            :
            "Технические работы";


        message.textContent =
            state.config.message ||
            "ElectroBase временно недоступен.";


        code.textContent =
            state.config.code ||
            "MAINTENANCE";

    }else{

        overlay.classList.add(
            "hidden"
        );

    }

}


/* =========================================================
   ROUTING
========================================================= */

function go(page){

    state.page=page;

    history.pushState(
        {},
        "",
        "#" + page
    );

    closeMobile();

    sendHeartbeat();

    render();

}


window.addEventListener(
    "popstate",
    () => {

        state.page =
            location.hash
                .replace("#","") ||
            "home";

        render();

    }
);


window.addEventListener(
    "hashchange",
    () => {

        state.page =
            location.hash
                .replace("#","") ||
            "home";

        render();

    }
);


/* =========================================================
   RENDER
========================================================= */

function render(){

    const app =
        document.getElementById(
            "app"
        );


    app.innerHTML="";


    updateNav();


    if(
        state.page === "home"
    ){

        renderHome();

    }

    else if(
        state.page === "subjects"
    ){

        renderSubjects();

    }

    else if(
        state.page.startsWith(
            "subject-"
        )
    ){

        renderSubject(
            state.page.replace(
                "subject-",
                ""
            )
        );

    }

    else if(
        state.page === "formulas"
    ){

        renderFormulas();

    }

    else if(
        state.page === "calculators"
    ){

        renderCalculators();

    }

    else if(
        state.page === "materials"
    ){

        renderMaterials();

    }

    else if(
        state.page === "about"
    ){

        renderAbout();

    }

    else if(
        state.page === "login"
    ){

        renderLogin();

    }

    else if(
        state.page === "profile"
    ){

        renderProfile();

    }

    else if(
        state.page === "admin-login"
    ){

        renderAdminLogin();

    }

    else if(
        state.page === "admin"
    ){

        renderAdmin();

    }

    else{

        state.page="home";

        renderHome();

    }


    updateSystemOverlay();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   NAVIGATION
========================================================= */

function updateNav(){

    document
        .querySelectorAll(
            "[data-nav]"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.nav ===
                    state.page
                );

            }
        );


    const account =
        document.getElementById(
            "accountButton"
        );


    if(account){

        account.textContent =
            state.user
            ?
            "Профиль"
            :
            "Войти";

    }

}

function selectFormulaFilter(
    category
){

    state.formulaFilter =
        category;

    renderFormulas();

}


function getFormulaHTML(
    query=""
){

    const filtered =
        formulas.filter(
            formula => {

                const categoryMatch =
                    state.formulaFilter ===
                    "Все" ||

                    formula.category ===
                    state.formulaFilter;


                const text =
                    (
                        formula.title+
                        " "+
                        formula.formula+
                        " "+
                        formula.desc+
                        " "+
                        formula.category
                    )
                    .toLowerCase();


                const queryMatch =
                    !query ||
                    text.includes(
                        query
                            .toLowerCase()
                    );


                return (
                    categoryMatch &&
                    queryMatch
                );

            }
        );


    if(!filtered.length){

        return `

            <div class="empty">

                Ничего не найдено.

            </div>

        `;

    }


    return filtered
        .map(
            formula => `

                <article class="formula-card">

                    <div class="formula-category">
                        ${formula.category}
                    </div>

                    <h3>
                        ${formula.title}
                    </h3>

                    <div class="formula-expression">
                        ${formula.formula}
                    </div>

                    <p>
                        ${formula.desc}
                    </p>

                    <button
                        class="copy-btn"
                        onclick="
                            copyText(
                                '${escapeAttribute(
                                    formula.formula
                                )}'
                            )
                        "
                    >
                        📋 Копировать
                    </button>

                </article>

            `
        )
        .join("");

}

function calculator(
    title,
    id,
    fields
){

    return `

        <article class="calculator">

            <div class="section-tag">
                CALCULATOR
            </div>

            <h3>
                ${title}
            </h3>


            <div
                class="fields"
                id="${id}Fields"
            >

                ${fields
                    .map(
                        field => `

                            <div class="field">

                                <label>
                                    ${field}
                                </label>

                                <input
                                    type="number"
                                    step="any"
                                    data-field="${field}"
                                    placeholder="${field}"
                                >

                            </div>

                        `
                    )
                    .join("")
                }

            </div>


            <div
                class="calc-result"
                id="${id}Result"
            >
                Введите значения.
            </div>


            <button
                class="button primary"
                onclick="
                    calculate(
                        '${id}'
                    )
                "
            >
                Рассчитать
            </button>

        </article>

    `;

}


function calculate(id){

    const fields =
        document.getElementById(
            `${id}Fields`
        );


    const values={};


    fields
        .querySelectorAll("input")
        .forEach(
            input => {

                if(
                    input.value !== ""
                ){

                    values[
                        input.dataset.field
                    ] =
                        Number(
                            input.value
                        );

                }

            }
        );


    let result="";


    if(id==="ohm"){

        if(
            values.U != null &&
            values.I != null
        ){

            result =
                `R = ${
                    values.U /
                    values.I
                } Ом`;

        }

        else if(
            values.U != null &&
            values.R != null
        ){

            result =
                `I = ${
                    values.U /
                    values.R
                } А`;

        }

        else if(
            values.I != null &&
            values.R != null
        ){

            result =
                `U = ${
                    values.I *
                    values.R
                } В`;

        }

        else{

            result =
                "Введите любые два значения.";

        }

    }


    if(id==="power"){

        result =
            values.U != null &&
            values.I != null

            ?

            `P = ${
                values.U *
                values.I
            } Вт`

            :

            "Введите U и I.";

    }


    if(id==="resistance"){

        result =
            values.U != null &&
            values.I != null

            ?

            `R = ${
                values.U /
                values.I
            } Ом`

            :

            "Введите U и I.";

    }


    if(id==="energy"){

        result =
            values.P != null &&
            values.t != null

            ?

            `W = ${
                values.P *
                values.t
            } Дж`

            :

            "Введите P и t.";

    }


    document.getElementById(
        `${id}Result`
    ).textContent =
        result;

}

async function userLogin(){

    const username =
        document.getElementById(
            "userLogin"
        ).value.trim();


    const password =
        document.getElementById(
            "userPassword"
        ).value;


    const error =
        document.getElementById(
            "userLoginError"
        );


    error.textContent="";


    if(
        !username ||
        !password
    ){

        error.textContent =
            "Заполните логин и пароль.";

        return;

    }


    try{

        const result =
            await api(
                "login",
                {
                    username,
                    password
                }
            );


        state.user =
            result.user;


        state.userToken =
            result.token;


        localStorage.setItem(
            "eb_user_token",
            result.token
        );


        toast(
            "Добро пожаловать!"
        );


        go("profile");

    }catch(error){

        error =
            error.message;

        document.getElementById(
            "userLoginError"
        ).textContent =
            error;

    }

}

async function createAccount(){

    const username =
        document.getElementById(
            "createUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "createPassword"
        ).value;


    const hours =
        Number(
            document.getElementById(
                "createHours"
            ).value
        );


    try{

        const result =
            await api(
                "createUser",
                {
                    token:
                        state.adminToken,

                    username,

                    password,

                    hours
                }
            );


        if(
            result.generatedPassword
        ){

            alert(
                "Аккаунт создан!\n\n"+
                "Логин: "+
                result.user.username+
                "\n"+
                "Пароль: "+
                result.generatedPassword+
                "\n"+
                "Истекает: "+
                formatDate(
                    result.user.expires_at
                )
            );

        }else{

            toast(
                "Аккаунт создан."
            );

        }


        await adminAccounts();

    }catch(error){

        toast(
            error.message
        );

    }

}


async function deleteUser(
    id
){

    if(
        !confirm(
            "Удалить этот аккаунт?"
        )
    ){

        return;

    }


    try{

        await api(
            "deleteUser",
            {
                token:
                    state.adminToken,

                id
            }
        );


        toast(
            "Аккаунт удалён."
        );


        await adminAccounts();

    }catch(error){

        toast(
            error.message
        );

    }

}

function renderLogTable(

){

            </div>

        `;

    }


    return `

        <div class="admin-table">

            <table>

                <thead>

                    <tr>

                        <th>
                            Время
                        </th>

                        <th>
                            Событие
                        </th>

                        <th>
                            Описание
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${logs
                        .map(
                            log => `

                                <tr>

                                    <td>
                                        ${formatDate(
                                            log.created_at
                                        )}
                                    </td>

                                    <td>
                                        ${escapeHTML(
                                            log.action
                                        )}
                                    </td>

                                    <td>

/* =========================================================
   THEME
========================================================= */

function toggleTheme(){

    /*
    Оставляем тёмную тему основной.
    В дальнейшем сюда можно добавить
    полноценную светлую тему.
    */

    document.body.classList.toggle(
        "light-mode"
    );

    const isLight =
        document.body.classList.contains(
            "light-mode"
        );


    localStorage.setItem(
        "eb_theme",
        isLight
        ?
        "light"
        :
        "dark"
    );


    toast(
        isLight
        ?
        "Светлая тема включена."
        :
        "Тёмная тема включена."
    );

}


/* =========================================================
   COPY
========================================================= */

function copyText(
    text
){

    navigator.clipboard
        .writeText(text)
        .then(
            () => {

                toast(
                    "Скопировано."
                );

            }
        )
        .catch(
            () => {

                toast(
                    "Не удалось скопировать."
                );

            }
        );

}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(
    value
){

    return String(value)
        .replace(
            /[&<>"']/g,
            char => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char])
        );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    ).replace(
        /`/g,
        "&#096;"
    );

}


function formatDate(
    value
){

    if(!value){

        return "—";

    }


    return new Date(
        value
    )
    .toLocaleString(
        "ru-RU",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

    event => {

            userLogin();

        }

            state.page === "admin-login" &&

        if(

            event.key.toLowerCase()==="k"

            event.preventDefault();

            go("formulas");

            setTimeout(
                () => {

                    document
                        .getElementById(

                        )

            );

        }

    }
);
